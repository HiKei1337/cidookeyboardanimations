  <desc id="desc">Optional donations in USDT to help publish the extension with automatic updates.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#171d19"/><stop offset="1" stop-color="#111416"/></linearGradient></defs>
  <rect x="1" y="1" width="1098" height="208" rx="18" fill="url(#bg)" stroke="#46523b"/>
  <rect x="30" y="36" width="4" height="138" rx="2" fill="#e2ff85"/>
  <text x="58" y="61" fill="#e2ff85" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">CIDOO RGB STUDIO / SUPPORT</text>
  <text x="58" y="111" fill="#f5f5ec" font-family="Arial,sans-serif" font-size="34" font-weight="700">Help bring it to the Chrome Web Store</text>
  <text x="58" y="149" fill="#a7aca7" font-family="Arial,sans-serif" font-size="18">One-time registration fee. Automatic updates after publication.</text>
